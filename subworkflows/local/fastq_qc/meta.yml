# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fastq_qc"
description: Raw-read QC and sample identity checking for FASTQ inputs -- read quality metrics (FastQC) and cross-sample identity/contamination checking (ngsCheckMate).
keywords:
  - qc
  - quality control
  - fastq
  - fastqc
  - ngscheckmate
  - sample identity
components:
  - fastqc
  - fastq_ngscheckmate
input:
  - ch_fastq:
      type: file
      description: |
        The input channel containing FASTQ read files
        Structure: [ val(meta), [ path(fastq1), path(fastq2)? ] ]
      pattern: "*.{fastq,fq}.gz"
  - ncm_snp_pt:
      type: file
      description: |
        ngsCheckMate SNP panel file used for identity checking
        Structure: [ val(meta), path(snp_pt) ]
      pattern: "*.pt"
output:
  - reports:
      type: file
      description: |
        The output channel containing FastQC and ngsCheckMate reports
        Structure: [ val(meta), path(report) ]
      pattern: "*.{html,zip,vaf,txt,pdf}"
  - versions:
      type: file
      description: |
        File containing software versions
        Structure: [ path(versions.yml) ]
      pattern: "versions.yml"
authors:
  - "@georgette-femerling"
maintainers:
  - "@georgette-femerling"
