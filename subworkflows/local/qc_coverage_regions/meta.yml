# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "qc_coverage_regions"
description: Computes per-gene coverage summaries for a custom BED region set, by running Mosdepth over the regions and aggregating the per-region mean coverage and threshold outputs into a per-gene table.
keywords:
  - coverage
  - mosdepth
  - per-gene
  - qc
components:
  - mosdepth
  - coverage/by/gene
input:
  - ch_bam_bai:
      type: file
      description: |
        The input channel containing the BAM/CRAM files and their indexes
        Structure: [ val(meta), path(bam/cram), path(bai/crai) ]
      pattern: "*.{bam,cram}"
  - qc_regions:
      type: file
      description: |
        BED file of regions to compute per-gene coverage for
        Structure: [ path(bed) ]
      pattern: "*.bed"
  - fasta:
      type: file
      description: |
        Optional. Reference genome FASTA, needed to process CRAM files.
        Structure: [ path(fasta) ]
      pattern: "*.fa*"
output:
  - reports:
      type: file
      description: |
        Per-gene mean coverage and coverage-at-threshold summary table
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.tsv"
authors:
  - "@georgette-femerling"
maintainers:
  - "@georgette-femerling"
