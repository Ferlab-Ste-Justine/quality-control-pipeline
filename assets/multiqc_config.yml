report_comment: >
  This report has been generated by the <a href="https://github.com/Ferlab-Ste-Justine/quality-control-pipeline/tree/dev" target="_blank">Ferlab-Ste-Justine/quality-control-pipeline</a>
  analysis pipeline.


report_section_order:
  "general-status":
    order: 1000
  "alignment-metrics":
    order: 1001
  "variant-calling-metrics":
    order: 1002
  "pedigree":
    order: 1003
  "gene-coverage":
    order: 1004
  "Ferlab-Ste-Justine-quality-control-pipeline-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "Ferlab-Ste-Justine-quality-control-pipeline-summary":
    order: -1002

export_plots: false

run_modules:
  - custom_content
  - fastqc
  - fastp
  - picard
  - samtools
  - bcftools
  - somalier
  - mosdepth
  - verifybamid

top_modules:
  - "custom_content"

remove_sections:
  - 'somalier-relatedness'
  - 'somalier-relatedness-heatmap'
  - 'somalier-hetcheck'
  - 'somalier-sexcheck'
  - 'samtools-percent-mapped'
  - 'mosdepth-xy-coverage'

use_filename_as_sample_name:
  - picard
  - verifybamid

preserve_module_raw_data: true
disable_version_detection: true
show_analysis_paths: false
show_analysis_time: true
