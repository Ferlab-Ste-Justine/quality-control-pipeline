report_comment: >
  This report has been generated by the <a href="https://github.com/Ferlab-Ste-Justine/quality-control-pipeline/releases/tag/2.0.0"
  target="_blank">Ferlab-Ste-Justine/quality-control-pipeline</a> analysis pipeline.


report_section_order:
  "general-status":
    order: 1000
  "alignment-metrics":
    order: 1001
  "variant-calling-metrics":
    order: 1002
  "pedigree":
    order: 1003
  "gene-coverage":
    order: 1004
  "Ferlab-Ste-Justine-quality-control-pipeline-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "Ferlab-Ste-Justine-quality-control-pipeline-summary":
    order: -1002

export_plots: false

run_modules:
- custom_content
- fastqc
- picard
- samtools
- bcftools
- somalier
- mosdepth
- verifybamid
- dragen

top_modules:
- "custom_content"

remove_sections:
- 'somalier-relatedness-heatmap'
- 'somalier-hetcheck'
- 'samtools-percent-mapped'
- 'mosdepth-xy-coverage'
- 'general_stats'                   # Built-in general stats section — replaced by our custom "General Status".
- 'general_stats_table'             # belt-and-braces: the table inside that section

extra_fn_clean_exts:
- ".CollectWgsMetrics.coverage_metrics"
- ".CollectHsMetrics.coverage_metrics"
- ".QualityYieldMetrics"
- ".selfSM"
- ".bcftools_stats"
- ".somalier"
- ".vcf_metrics"
- "_fastqc"
- ".stats"
- ".metrics"
  # DRAGEN per-sample metric files: <sample>.final.<metric_type>.csv
- ".final.mapping_metrics"
- ".final.wgs_coverage_metrics"
- ".final.vc_metrics"
- ".final.ploidy_estimation_metrics"
- ".final"
- type: regex
  pattern: "_L[0-9]{3}"


use_filename_as_sample_name:
- picard
- verifybamid
- bcftools
- dragen

preserve_module_raw_data: true
disable_version_detection: true
show_analysis_paths: false
show_analysis_time: true
