report_comment: >
  This report has been generated by the <a href="https://github.com/Ferlab-Ste-Justine/quality-control-pipeline/tree/dev" target="_blank">Ferlab-Ste-Justine/quality-control-pipeline</a>
  analysis pipeline.
report_section_order:
  "Ferlab-Ste-Justine-quality-control-pipeline-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "Ferlab-Ste-Justine-quality-control-pipeline-summary":
    order: -1002

export_plots: true

run_modules:
  - custom_content
  - fastqc
  - fastp
  - ngscheckmate
  - samtools
  - picard
  - somalier
  - mosdepth
  - verifybamid

module_order:
  - fastqc:
      name: "FastQC"
      path_filters:
        - "*.zip"
  - picard:
      name: "Picard"
  - fastp:
      name: "fastp"
  - samtools:
      name: "Samtools"
  - somalier:
      name: "Somalier"
  - mosdepth:
      name: "Mosdepth"
  - verifybamid:
      name: "VerifyBamID2"

table_cond_formatting_rules:
  mqc-generalstats-uniquely_mapped_percent:
    pass:
      - gt: 80
    warn:
      - lt: 80
    fail:
      - lt: 70

# Other MultiQC config stuff here
custom_data:
  example_files:
    id: "checks"
    description: "Example checks"
    file_format: "tsv"
    plot_type: "generalstats"
    pconfig:
      title: "Example Checks"
      ylab: "Check"
      hline:
        - 0.5
      table_cond_formatting:
        - mqc-generalstats-Check

sp:
  example_files:
    fn: "example_files_*"

disable_version_detection: true
