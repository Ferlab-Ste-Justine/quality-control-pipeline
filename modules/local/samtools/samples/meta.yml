---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "samtools_samples"
description: Runs `samtools samples` to extract the sample name(s) registered in a BAM/CRAM's read-group headers into a text file, used to check whether it matches the samplesheet-registered ID.
keywords:
  - samples
  - bam
  - cram
  - sample identity
tools:
  - "samtools":
      description: "Tools for dealing with SAM, BAM and CRAM files"
      homepage: "http://www.htslib.org/"
      documentation: "https://www.htslib.org/doc/samtools.html"
      tool_dev_url: "https://github.com/samtools/samtools"
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT"]
      identifier: biotools:samtools

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bam:
        type: file
        description: BAM/CRAM file to query
        pattern: "*.{bam,cram}"
        ontologies:
          - edam: "http://edamontology.org/format_2572"
          - edam: "http://edamontology.org/format_3462"
    - idx:
        type: file
        description: Index of the BAM/CRAM file
        pattern: "*.{bai,crai,csi}"
  - fasta:
      type: file
      description: Optional reference genome FASTA, needed to read CRAM files
      pattern: "*.fa*"
  - references_file:
      type: file
      description: Optional file listing reference sequence names, passed to `samtools samples -F`
      pattern: "*"

output:
  - output:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.samples.txt":
          type: file
          description: Text file listing the sample name(s) found in the BAM/CRAM read-group headers
          pattern: "*.txt"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@georgette-femerling"
maintainers:
  - "@georgette-femerling"
