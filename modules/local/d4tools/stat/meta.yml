# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "d4tools_stat"
description: Calculates coverage statistics from D4 files.
keywords:
  - "d4tools"
  - "stat"
  - "coverage"
  - "qc"
tools:
  - "d4tools":
      description: "Fast analysis and compact storage of quantitative genomics datasets"
      documentation: "https://github.com/38/d4-format"
      tool_dev_url: "https://github.com/38/d4-format"
      doi: "10.1038/s43588-021-00085-0"
      licence: ["MIT"]
      identifier: biotools:d4tools

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - d4:
        type: file
        description: D4 file
        pattern: "*.{d4}"
        ontologies: []
  - - bed_regions:
        type: file
        description: BED file with regions to calculate statistics on
        pattern: "*.{bed}"
        ontologies: []
output:
  stat:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.txt":
          type: file
          description: statistics output file
          pattern: "*.{txt}"
          ontologies: []
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML

authors:
  - "@georgette-femerling"
maintainers:
  - "@georgette-femerling"
